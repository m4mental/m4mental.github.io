<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>m4mental store</title>
  <!-- PeerJS WebRTC for P2P File Drop -->
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background-color: #0b0e14; color: #c9d1d9; padding: 20px 15px; }
    .container { max-width: 1000px; margin: 0 auto; }

    /* Header */
    header { text-align: center; margin-bottom: 22px; }
    .logo-title { font-size: 2.3rem; font-weight: 800; color: #2dd4bf; letter-spacing: -0.5px; margin-bottom: 10px; }
    .header-icons-bar { display: flex; justify-content: center; align-items: center; gap: 10px; margin-bottom: 12px; }
    .icon-btn { background: #161b22; border: 1px solid #30363d; color: #58a6ff; width: 40px; height: 40px; border-radius: 10px; display: inline-flex; align-items: center; justify-content: center; text-decoration: none; cursor: pointer; font-size: 1.2rem; transition: 0.2s; }
    .icon-btn:hover { border-color: #2dd4bf; color: #2dd4bf; }
    .time-badge { display: inline-flex; align-items: center; gap: 6px; background-color: rgba(45, 212, 191, 0.1); color: #2dd4bf; padding: 5px 14px; border-radius: 20px; font-size: 0.8rem; font-weight: 600; border: 1px solid rgba(45, 212, 191, 0.25); }

    /* Search Bar & Categories */
    .search-input { width: 100%; background-color: #161b22; border: 1px solid #30363d; color: #f0f6fc; padding: 12px 16px; border-radius: 10px; font-size: 0.95rem; outline: none; margin-bottom: 15px; transition: border 0.2s; }
    .search-input:focus { border-color: #58a6ff; }

    .categories { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 20px; }
    .cat-pill { background-color: #161b22; color: #8b949e; border: 1px solid #30363d; padding: 6px 14px; border-radius: 8px; font-size: 0.8rem; font-weight: 600; cursor: pointer; transition: 0.2s; }
    .cat-pill.active, .cat-pill:hover { background-color: #1f6beb; color: #ffffff; border-color: #1f6beb; }

    /* 2-Column Grid Layout */
    .app-grid { display: grid; grid-template-columns: 1fr; gap: 12px; }
    @media (min-width: 680px) { .app-grid { grid-template-columns: 1fr 1fr; } }

    /* App Card */
    .app-card { background-color: #161b22; border: 1px solid #30363d; border-radius: 12px; padding: 16px; transition: border 0.2s; align-self: start; }
    .app-card:hover { border-color: #58a6ff; }
    .app-card-header { display: flex; justify-content: space-between; align-items: center; cursor: pointer; user-select: none; }
    .app-card-title { font-size: 1.25rem; font-weight: 800; color: #ffffff; }
    .patch-count-badge { background: rgba(56, 189, 248, 0.1); color: #38bdf8; border: 1px solid rgba(56, 189, 248, 0.3); padding: 3px 10px; border-radius: 12px; font-size: 0.72rem; font-weight: 800; letter-spacing: 0.5px; }

    /* Expanded Content inside Card */
    .app-card-body { display: none; margin-top: 14px; border-top: 1px solid #21262d; padding-top: 12px; }
    .app-card.open .app-card-body { display: block; }
    .section-heading { font-size: 0.7rem; font-weight: 700; color: #8b949e; letter-spacing: 0.5px; text-transform: uppercase; margin-bottom: 10px; }

    /* Engine Box inside Card */
    .engine-box { background-color: #0d1117; border: 1px solid #21262d; border-radius: 10px; padding: 12px; margin-bottom: 10px; }
    .engine-pills { display: flex; align-items: center; gap: 6px; margin-bottom: 10px; }
    .eng-name { background-color: #1f6beb; color: #ffffff; padding: 2px 10px; border-radius: 12px; font-size: 0.75rem; font-weight: 700; }
    .eng-stat-green { background: rgba(35, 134, 54, 0.2); color: #3fb950; border: 1px solid rgba(35, 134, 54, 0.4); padding: 2px 8px; border-radius: 12px; font-size: 0.72rem; font-weight: 700; }

    /* Build Rows */
    .build-item { background-color: #161b22; border: 1px solid #30363d; border-radius: 8px; padding: 8px 12px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; transition: background 0.2s; margin-bottom: 6px; user-select: none; }
    .build-item:last-child { margin-bottom: 0; }
    .build-item:hover { background-color: #21262d; border-color: #58a6ff; }
    .build-left { display: flex; align-items: center; gap: 8px; font-size: 0.82rem; flex-wrap: wrap; }
    
    .type-badge { font-size: 0.7rem; font-weight: 800; padding: 2px 7px; border-radius: 4px; letter-spacing: 0.5px; }
    .ver-code { font-weight: 700; color: #f0f6fc; }
    .build-code { color: #38bdf8; font-weight: 600; }
    .build-date { font-size: 0.75rem; color: #8b949e; }

    /* Detail Modal Overlay */
    .detail-modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.85); backdrop-filter: blur(6px); z-index: 2000; align-items: center; justify-content: center; padding: 15px; }
    .detail-modal-container { background-color: #161b22; border: 1px solid #30363d; border-radius: 16px; max-width: 750px; width: 100%; max-height: 90vh; overflow-y: auto; padding: 20px; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.8); }

    .detail-modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; border-bottom: 1px solid #21262d; padding-bottom: 12px; }
    .detail-title { font-size: 1.3rem; font-weight: 800; color: #f0f6fc; }
    .detail-top-right { display: flex; align-items: center; gap: 10px; }
    .obtainium-btn { background-color: #1f6beb; color: #ffffff; padding: 6px 14px; border-radius: 8px; text-decoration: none; font-size: 0.8rem; font-weight: 700; transition: 0.2s; }
    .obtainium-btn:hover { background-color: #388bfd; }
    .detail-close-btn { background: #21262d; border: 1px solid #30363d; color: #8b949e; width: 32px; height: 32px; border-radius: 8px; font-size: 1.1rem; cursor: pointer; display: flex; align-items: center; justify-content: center; }
    .detail-close-btn:hover { color: #fff; background: #30363d; }

    /* File Download Box inside Modal */
    .modal-build-card { background-color: #0d1117; border: 1px solid #21262d; border-radius: 12px; padding: 14px 16px; margin-bottom: 10px; overflow: hidden; }
    .modal-build-header { display: flex; justify-content: space-between; align-items: center; cursor: pointer; user-select: none; }
    .modal-build-content { display: none; margin-top: 12px; padding-top: 10px; border-top: 1px solid #21262d; }
    .modal-build-card.open .modal-build-content { display: block; }

    .m-build-title { font-size: 1.05rem; font-weight: 800; color: #ffffff; }
    .m-build-sub { font-size: 0.8rem; color: #8b949e; margin-bottom: 10px; }

    .arch-group-title { font-size: 0.78rem; font-weight: 700; color: #8b949e; margin: 10px 0 6px 0; }

    .file-box { display: flex; justify-content: space-between; align-items: center; padding: 10px 14px; border-radius: 8px; text-decoration: none; margin-bottom: 6px; transition: 0.2s; border: 1px solid transparent; }
    .arm64-box { background-color: #1f293d; border-color: #2b354f; }
    .arm64-box:hover { background-color: #25334e; border-color: #388bfd; }
    .arm32-box { background-color: #122c27; border-color: #19443b; }
    .arm32-box:hover { background-color: #19443b; border-color: #2ea043; }

    .fb-title { font-weight: 700; color: #58a6ff; font-size: 0.9rem; }
    .arm32-box .fb-title { color: #3fb950; }
    .fb-sub { font-size: 0.78rem; color: #8b949e; }
    .fb-right { font-size: 0.78rem; font-weight: 600; color: #c9d1d9; }

    .view-source-link { display: inline-block; margin-top: 8px; font-size: 0.82rem; color: #58a6ff; text-decoration: none; font-weight: 600; }
    .view-source-link:hover { text-decoration: underline; }
    .loading-state { text-align: center; color: #8b949e; padding: 50px 0; font-size: 1rem; grid-column: 1 / -1; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <!-- Website Name -->
      <div class="logo-title">m4mental store</div>
      
      <!-- GitHub Logo + P2P Rocket Button Right Next to It -->
      <div class="header-icons-bar">
        <a href="https://github.com/m4mental/my-rvb-builder" target="_blank" class="icon-btn" title="GitHub Repository">
          <svg width="20" height="20" fill="currentColor" viewBox="0 0 24 24"><path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0024 12c0-6.63-5.37-12-12-12z"/></svg>
        </a>
        <button class="icon-btn" onclick="renderP2PShareUI()" title="P2P File Drop / Share">🚀</button>
      </div>

      <div class="time-badge">
        <span>✓ Live Store Sync</span>
      </div>
    </header>

    <input type="text" id="searchInput" class="search-input" placeholder="Search apps..." oninput="renderStore()">

    <div class="categories">
      <button class="cat-pill active" onclick="setCat('All', this)">All</button>
      <button class="cat-pill" onclick="setCat('Recently Updated', this)">Recently Updated</button>
      <button class="cat-pill" onclick="setCat('YouTube', this)">YouTube</button>
      <button class="cat-pill" onclick="setCat('Google', this)">Google</button>
      <button class="cat-pill" onclick="setCat('Media', this)">Media</button>
      <button class="cat-pill" onclick="setCat('Modules', this)">Magisk Modules</button>
    </div>

    <div id="appGrid" class="app-grid"></div>
  </div>

  <!-- Detail Modal -->
  <div id="detailModal" class="detail-modal-overlay" onclick="closeDetailModalOnOverlay(event)">
    <div class="detail-modal-container">
      <div class="detail-modal-header">
        <div class="detail-title" id="detailTitle">App Details</div>
        <div style="display:flex; gap:10px; align-items:center;">
          <a href="obtainium://app/https://github.com/m4mental/my-rvb-builder" class="obtainium-btn">Install with Obtainium</a>
          <button class="detail-close-btn" onclick="closeDetailModal()">✕</button>
        </div>
      </div>
      <div id="detailBuildsList"></div>
    </div>
  </div>

  <script>
    let allAppsData = {};
    let activeCat = 'All';

    // P2P Share PeerJS Engine (With Disconnect Red Button + Multi-File Support)
    let peer = null, peerConn = null, myPinCode = '';
    function generatePin() { return Math.floor(1000 + Math.random() * 9000).toString(); }

    function initP2PPeer() {
      if (peer && !peer.destroyed) return;
      myPinCode = 'm4m-' + generatePin();
      peer = new Peer(myPinCode, { debug: 1 });
      peer.on('open', (id) => {
        const el = document.getElementById('myPinDisplay');
        if (el) el.innerText = myPinCode.replace('m4m-', '');
      });
      peer.on('connection', (conn) => {
        peerConn = conn;
        setupConnListeners();
      });
    }

    function setupConnListeners() {
      const el = document.getElementById('p2pStatus');
      if (el) el.innerText = '⚡ Connected to peer device!';
      const dcBtn = document.getElementById('disconnectBtn');
      if (dcBtn) dcBtn.style.display = 'inline-block';

      peerConn.on('data', (data) => {
        if (data.file) {
          const blob = new Blob([data.file], { type: data.type || 'application/octet-stream' });
          const url = URL.createObjectURL(blob);
          const el = document.getElementById('p2pStatus');
          let fileBox = document.getElementById('receivedFilesList');
          
          if (!fileBox) {
            if (el) el.innerHTML = `<b>🎉 Received Files:</b><div id="receivedFilesList" style="margin-top:10px; display:flex; flex-direction:column; gap:8px; align-items:center;"></div>`;
            fileBox = document.getElementById('receivedFilesList');
          }

          if (fileBox) {
            const link = document.createElement('a');
            link.href = url;
            link.download = data.name;
            link.style = "background:#22c55e; color:#fff; padding:10px 18px; border-radius:8px; text-decoration:none; display:inline-block; font-weight:bold; margin-top:5px;";
            link.innerHTML = `📥 Save ${data.name} (${data.fileIndex || 1}/${data.totalFiles || 1})`;
            fileBox.appendChild(link);
          }
        }
      });

      peerConn.on('close', () => {
        const el = document.getElementById('p2pStatus');
        if (el) el.innerText = '🔌 Device disconnected.';
        const dcBtn = document.getElementById('disconnectBtn');
        if (dcBtn) dcBtn.style.display = 'none';
        peerConn = null;
      });
    }

    function connectToSender() {
      const pin = document.getElementById('connectPinInput').value.trim();
      if (!pin || pin.length !== 4) { alert('Enter valid 4-digit PIN.'); return; }
      const el = document.getElementById('p2pStatus');
      if (el) el.innerText = '🔄 Connecting to PIN: ' + pin + '...';
      if (!peer) initP2PPeer();
      peerConn = peer.connect('m4m-' + pin);
      peerConn.on('open', setupConnListeners);
    }

    function disconnectDevice() {
      if (peerConn) {
        peerConn.close();
        peerConn = null;
      }
      const el = document.getElementById('p2pStatus');
      if (el) el.innerText = '🔌 Disconnected cleanly. Generating new PIN...';
      const dcBtn = document.getElementById('disconnectBtn');
      if (dcBtn) dcBtn.style.display = 'none';

      if (peer) {
        peer.destroy();
        peer = null;
      }
      setTimeout(initP2PPeer, 500);
    }

    async function sendP2PFiles() {
      const fileInput = document.getElementById('p2pFileInput');
      if (!fileInput || !fileInput.files || fileInput.files.length === 0) { alert('Select at least one file.'); return; }
      if (!peerConn) { alert('Connect via PIN first.'); return; }
      
      const files = Array.from(fileInput.files);
      const el = document.getElementById('p2pStatus');

      for (let i = 0; i < files.length; i++) {
        const file = files[i];
        if (el) el.innerText = `📤 Transferring (${i + 1}/${files.length}): ${file.name}...`;

        await new Promise((resolve) => {
          const reader = new FileReader();
          reader.onload = (e) => {
            peerConn.send({
              name: file.name,
              type: file.type,
              file: e.target.result,
              fileIndex: i + 1,
              totalFiles: files.length
            });
            resolve();
          };
          reader.readAsArrayBuffer(file);
        });

        await new Promise(r => setTimeout(r, 300));
      }

      if (el) el.innerText = `🎉 All ${files.length} file(s) transferred successfully!`;
    }

    function renderP2PShareUI() {
      const container = document.getElementById('appGrid');
      if (!container) return;
      container.innerHTML = `
        <div style="grid-column:1/-1; max-width:800px; margin:10px auto; background:#161b22; border:1px solid #30363d; border-radius:16px; padding:24px; text-align:center;">
          <div style="font-size:1.5rem; font-weight:800; color:#2dd4bf; margin-bottom:6px;">🚀 Nothing Warp / P2P Multi-File Drop</div>
          <div style="font-size:0.88rem; color:#94a3b8; margin-bottom:20px;">Direct Peer-to-Peer file sharing between Android, iOS, Windows & Mac.<br><b>Select Multiple Files • Zero server uploads • Zero size limits</b></div>
          <div style="display:grid; grid-template-columns:repeat(auto-fit, minmax(260px, 1fr)); gap:16px;">
            <div style="background:#0d1117; border:1px solid #21262d; border-radius:14px; padding:20px;">
              <div style="font-weight:700; color:#fff;">1. Your Device PIN (Receive Files)</div>
              <div style="font-size:2.2rem; font-weight:800; color:#38bdf8; letter-spacing:4px; background:#161b22; padding:10px; border-radius:10px; border:1px dashed #30363d; margin:10px 0;" id="myPinDisplay">----</div>
            </div>
            <div style="background:#0d1117; border:1px solid #21262d; border-radius:14px; padding:20px;">
              <div style="font-weight:700; color:#fff;">2. Connect & Send (Enter PIN)</div>
              <input type="number" id="connectPinInput" style="width:100%; background:#161b22; border:1px solid #30363d; color:#fff; font-size:1.2rem; text-align:center; padding:10px; border-radius:10px; margin:10px 0;" placeholder="1234">
              <button style="background:#2563eb; color:#fff; border:none; padding:10px; border-radius:10px; font-weight:700; cursor:pointer; width:100%;" onclick="connectToSender()">Connect Device</button>
            </div>
          </div>
          <div style="border:2px dashed #30363d; border-radius:12px; padding:20px; margin-top:15px; cursor:pointer;" onclick="document.getElementById('p2pFileInput').click()">
            <div style="font-size:1.8rem;">📁</div>
            <div style="font-weight:700; color:#f0f6fc;">Click to select multiple files (APKs, ZIPs, Videos, Photos)</div>
            <input type="file" id="p2pFileInput" multiple style="display:none;" onchange="sendP2PFiles()">
          </div>
          <div style="margin-top:15px; font-size:0.9rem; font-weight:600; color:#38bdf8;" id="p2pStatus">Status: Waiting for connection...</div>
          <div style="margin-top:15px; display:flex; justify-content:center; gap:10px; flex-wrap:wrap;">
            <button id="disconnectBtn" onclick="disconnectDevice()" style="display:none; background:#dc2626; color:#fff; border:none; padding:8px 16px; border-radius:8px; cursor:pointer; font-weight:bold;">🔌 Disconnect Device</button>
            <button onclick="location.reload()" style="background:#21262d; border:1px solid #30363d; color:#9ca3af; padding:8px 16px; border-radius:8px; cursor:pointer; font-weight:bold;">← Back to App Store</button>
          </div>
        </div>
      `;
      initP2PPeer();
    }

    // 100% Direct Download & Release Tags from m4mental
    async function loadStore() {
      const container = document.getElementById('appGrid');
      
      const urls = [
        'https://api.github.com/repos/m4mental/my-rvb-builder/releases',
        'https://raw.githubusercontent.com/nullcpy/nullcpy.github.io/main/releases.json'
      ];

      let data = null;
      for (let u of urls) {
        try {
          const res = await fetch(u + '?t=' + Date.now());
          if (res.ok) {
            data = await res.json();
            if (Array.isArray(data) && data.length > 0) break;
          }
        } catch (e) {}
      }

      if (!data || !Array.isArray(data)) {
        container.innerHTML = '<div class="loading-state">Unable to load catalog. Please check Releases on GitHub.</div>';
        return;
      }

      processReleases(data);
      renderStore();
    }

    function cleanAppName(filename) {
      if (!filename) return 'App';
      let name = filename.toLowerCase();
      if (name.includes('moviebox')) return 'MovieBox';
      if (name.includes('google-photos') || name.includes('photos')) return 'Google Photos';
      if (name.includes('youtube-music') || name.includes('yt-music')) return 'YouTube Music';
      if (name.includes('youtube')) return 'YouTube';
      if (name.includes('reddit')) return 'Reddit';
      if (name.includes('twitter') || name.includes('x-morphe')) return 'X / Twitter';
      
      let clean = filename.replace(/\.(apk|zip)$/i, '').replace(/[-_](v\d|morphe|revanced|arm|module|androidtv).*/i, '');
      clean = clean.replace(/[-_]/g, ' ').trim();
      return clean.charAt(0).toUpperCase() + clean.slice(1);
    }

    function getCategory(appName, filename) {
      let name = (appName + ' ' + filename).toLowerCase();
      if (name.includes('youtube')) return 'YouTube';
      if (name.includes('google') || name.includes('photos')) return 'Google';
      if (name.includes('movie') || name.includes('media') || name.includes('tv')) return 'Media';
      return 'Popular';
    }

    function getAppVersion(filename) {
      const match = filename.match(/v(\d+(\.\d+)+)/i);
      return match ? match[0] : 'v1.0.0';
    }

    function getPatchEngine(filename) {
      let name = filename.toLowerCase();
      if (name.includes('morphed') || name.includes('rvx')) return 'RVX Morphed';
      if (name.includes('morphe')) return 'Morphe';
      if (name.includes('extended') || name.includes('rve')) return 'ReVanced Extended';
      if (name.includes('advanced')) return 'ReVanced Advanced';
      return 'ReVanced';
    }

    function getAssetBadge(filename, rel) {
      let relName = rel ? (rel.name || rel.tag_name || '') : '';
      let isPreRelease = rel ? rel.prerelease : false;
      let name = (filename + ' ' + relName).toLowerCase();
      
      if (name.includes('androidtv') || name.includes('android-tv') || name.includes('-tv-') || name.includes('tv')) {
        return { label: 'ANDROID TV', color: '#c084fc', bg: 'rgba(192, 132, 252, 0.18)' };
      }
      if (name.includes('beta')) {
        return { label: 'BETA', color: '#f59e0b', bg: 'rgba(245, 158, 11, 0.18)' };
      }
      if (name.includes('exp') || name.includes('experimental')) {
        return { label: 'EXPERIMENTAL', color: '#a855f7', bg: 'rgba(168, 85, 247, 0.18)' };
      }
      if (isPreRelease) {
        return { label: 'PRE-RELEASE', color: '#f59e0b', bg: 'rgba(245, 158, 11, 0.18)' };
      }
      return { label: 'STABLE', color: '#3fb950', bg: 'rgba(35, 134, 54, 0.18)' };
    }

    function formatFileSize(bytes) {
      if (!bytes) return '75 MB';
      return (bytes / (1024 * 1024)).toFixed(2) + ' MB';
    }

    function processReleases(releases) {
      allAppsData = {};
      const seenUrls = new Set();

      releases.forEach(rel => {
        const buildTag = rel.tag_name || rel.tag || 'Latest';
        const releaseDate = rel.published_at 
          ? new Date(rel.published_at).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' })
          : 'Recent';

        const assets = rel.assets || rel.files || [];

        assets.forEach(asset => {
          let downloadUrl = asset.browser_download_url || asset.url || '';
          if (!downloadUrl) return;

          // Force download link & release tag to m4mental/my-rvb-builder
          downloadUrl = downloadUrl.replace(/nullcpy\/rvb/g, 'm4mental/my-rvb-builder');

          if (seenUrls.has(downloadUrl)) return;
          seenUrls.add(downloadUrl);

          const appName = cleanAppName(asset.name);
          const category = getCategory(appName, asset.name);
          const engine = getPatchEngine(asset.name);
          const version = getAppVersion(asset.name);
          const badge = getAssetBadge(asset.name, rel);
          
          const isModule = asset.name.endsWith('.zip');
          const isArm32 = asset.name.toLowerCase().includes('arm-v7a') || asset.name.toLowerCase().includes('arm32');
          const sizeStr = formatFileSize(asset.size);

          if (!allAppsData[appName]) {
            allAppsData[appName] = {
              name: appName,
              category: category,
              engines: {}
            };
          }

          if (!allAppsData[appName].engines[engine]) {
            allAppsData[appName].engines[engine] = {
              name: engine,
              builds: {}
            };
          }

          const variantKey = `${version}-${badge.label}-${buildTag}`;
          
          if (!allAppsData[appName].engines[engine].builds[variantKey]) {
            allAppsData[appName].engines[engine].builds[variantKey] = {
              tag: buildTag,
              version: version,
              date: releaseDate,
              badge: badge,
              files: []
            };
          }

          allAppsData[appName].engines[engine].builds[variantKey].files.push({
            filename: asset.name,
            downloadUrl: downloadUrl,
            isModule: isModule,
            isArm32: isArm32,
            sizeStr: sizeStr
          });
        });
      });
    }

    function setCat(cat, btn) {
      activeCat = cat;
      document.querySelectorAll('.cat-pill').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      renderStore();
    }

    function renderStore() {
      const container = document.getElementById('appGrid');
      const search = document.getElementById('searchInput').value.toLowerCase().trim();
      container.innerHTML = '';

      const appNames = Object.keys(allAppsData);
      if (appNames.length === 0) {
        container.innerHTML = '<div class="loading-state">No apps found.</div>';
        return;
      }

      let count = 0;
      appNames.forEach((appName, appIdx) => {
        const app = allAppsData[appName];

        const matchesSearch = app.name.toLowerCase().includes(search);
        const matchesCat = (activeCat === 'All' || activeCat === 'Recently Updated') ||
                           (activeCat === 'Modules' && Object.values(app.engines).some(e => Object.values(e.builds).some(b => b.files.some(f => f.isModule)))) ||
                           (app.category === activeCat);

        if (matchesSearch && matchesCat) {
          count++;
          
          let enginesHTML = '';
          let totalPatchCount = Object.keys(app.engines).length;

          Object.keys(app.engines).forEach(engineName => {
            const eng = app.engines[engineName];
            let buildsHTML = '';
            let totalFiles = 0;

            Object.keys(eng.builds).forEach(vKey => {
              const b = eng.builds[vKey];
              totalFiles += b.files.length;

              buildsHTML += `
                <div class="build-item" data-app="${appName}" data-engine="${engineName}" data-vkey="${vKey}" onclick="handleRowClick(this)">
                  <div class="build-left">
                    <span class="type-badge" style="color:${b.badge.color}; background:${b.badge.bg}; border: 1px solid ${b.badge.color}40;">${b.badge.label}</span>
                    <span class="ver-code">${b.version}</span>
                    <span class="build-code">Build ${b.tag}</span>
                  </div>
                  <span class="build-date">${b.date}</span>
                </div>
              `;
            });

            enginesHTML += `
              <div class="engine-box">
                <div class="engine-pills">
                  <span class="eng-name">${engineName}</span>
                  <span class="eng-stat-green">${totalFiles} Files</span>
                </div>
                <div>${buildsHTML}</div>
              </div>
            `;
          });

          const card = document.createElement('div');
          card.className = `app-card ${count === 1 ? 'open' : ''}`;
          card.id = `card-${appIdx}`;

          card.innerHTML = `
            <div class="app-card-header" onclick="toggleCard('card-${appIdx}')">
              <div class="app-card-title">${app.name}</div>
              <span class="patch-count-badge">${totalPatchCount} PATCH${totalPatchCount > 1 ? 'ES' : ''}</span>
            </div>
            <div class="app-card-body">
              <div class="section-heading">AVAILABLE PATCHES</div>
              ${enginesHTML}
            </div>
          `;

          container.appendChild(card);
        }
      });

      if (count === 0) {
        container.innerHTML = '<div class="loading-state">No matching apps found.</div>';
      }
    }

    function toggleCard(id) {
      const card = document.getElementById(id);
      if (card) card.classList.toggle('open');
    }

    function handleRowClick(el) {
      const appName = el.getAttribute('data-app');
      const engineName = el.getAttribute('data-engine');
      const vKey = el.getAttribute('data-vkey');
      openDetailModal(appName, engineName, vKey);
    }

    function openDetailModal(appName, engineName, targetVKey) {
      const app = allAppsData[appName];
      if (!app || !app.engines[engineName]) return;

      const eng = app.engines[engineName];
      document.getElementById('detailTitle').innerText = `${appName} • ${engineName}`;

      const buildsListContainer = document.getElementById('detailBuildsList');
      buildsListContainer.innerHTML = '';

      Object.keys(eng.builds).forEach((vKey, bIdx) => {
        const b = eng.builds[vKey];

        const arm64Files = b.files.filter(f => !f.isArm32);
        const arm32Files = b.files.filter(f => f.isArm32);

        let arm64HTML = '';
        arm64Files.forEach(f => {
          arm64HTML += `
            <a href="${f.downloadUrl}" class="file-box arm64-box" target="_blank">
              <div>
                <div class="fb-title">${appName}</div>
                <div class="fb-sub">${engineName} • ${b.version}</div>
              </div>
              <div class="fb-right">
                ARM64 • ${f.isModule ? 'Module' : 'APK'} • ${f.sizeStr}
              </div>
            </a>
          `;
        });

        let arm32HTML = '';
        arm32Files.forEach(f => {
          arm32HTML += `
            <a href="${f.downloadUrl}" class="file-box arm32-box" target="_blank">
              <div>
                <div class="fb-title">${appName}</div>
                <div class="fb-sub">${engineName} • ${b.version}</div>
              </div>
              <div class="fb-right">
                ARM32 • ${f.isModule ? 'Module' : 'APK'} • ${f.sizeStr}
              </div>
            </a>
          `;
        });

        const card = document.createElement('div');
        const cardId = `modal-build-${bIdx}`;
        const isTarget = targetVKey ? (vKey === targetVKey) : (bIdx === 0);
        card.className = `modal-build-card ${isTarget ? 'open' : ''}`;
        card.id = cardId;

        const myReleaseUrl = `https://github.com/m4mental/my-rvb-builder/releases/tag/${b.tag}`;

        card.innerHTML = `
          <div class="modal-build-header" onclick="toggleModalBuild('${cardId}')">
            <div>
              <div class="m-build-title">Build ${b.tag}</div>
              <div class="m-build-sub" style="margin-bottom:0; margin-top:3px;">${b.date} • ${b.version}</div>
            </div>
            <span class="type-badge" style="color:${b.badge.color}; background:${b.badge.bg}; border: 1px solid ${b.badge.color}40;">${b.badge.label}</span>
          </div>
          <div class="modal-build-content">
            ${arm64HTML ? `<div class="arch-group-title">ARM64</div>${arm64HTML}` : ''}
            ${arm32HTML ? `<div class="arch-group-title">ARM32</div>${arm32HTML}` : ''}
            <a href="${myReleaseUrl}" target="_blank" class="view-source-link">View source release →</a>
          </div>
        `;

        buildsListContainer.appendChild(card);
      });

      document.getElementById('detailModal').style.display = 'flex';
    }

    function toggleModalBuild(targetId) {
      const modalContainer = document.getElementById('detailBuildsList');
      const allCards = modalContainer.querySelectorAll('.modal-build-card');

      allCards.forEach(card => {
        if (card.id === targetId) {
          card.classList.toggle('open');
        } else {
          card.classList.remove('open');
        }
      });
    }

    function closeDetailModal() {
      document.getElementById('detailModal').style.display = 'none';
    }

    function closeDetailModalOnOverlay(e) {
      if (e.target.id === 'detailModal') closeDetailModal();
    }

    document.addEventListener('DOMContentLoaded', loadStore);
  </script>
</body>
</html>
